name: Build Android APK (Gradle)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: '34.0.0'
        id: android-setup

      - name: Debug Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "sdk-path output: ${{ steps.android-setup.outputs.sdk-path }}"
          ls -la /usr/lib/android-sdk 2>/dev/null | head -10
          ls -la /opt/android 2>/dev/null | head -10

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Debug generated files
        run: |
          echo "=== android/gradle.properties ==="
          cat android/gradle.properties
          echo "=== android/gradle/wrapper/gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo "=== android/app/build.gradle (head) ==="
          head -30 android/app/build.gradle

      - name: Create local.properties
        run: echo "sdk.dir=${{ steps.android-setup.outputs.sdk-path }}" > android/local.properties

      - name: Debug local.properties
        run: cat android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30