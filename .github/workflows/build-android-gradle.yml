name: Build Android APK (Gradle)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: '34.0.0'

      - name: Create local.properties
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # setup-android sets ANDROID_HOME to the SDK root
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          elif [ -d "/usr/lib/android-sdk" ]; then
            echo "sdk.dir=/usr/lib/android-sdk" > android/local.properties
          elif [ -d "/opt/android" ]; then
            echo "sdk.dir=/opt/android" > android/local.properties
          else
            # Find SDK
            SDK_PATH=$(find / -maxdepth 3 -name "platforms" -path "*/android*" -type d 2>/dev/null | head -1 | sed 's|/platforms/.*||')
            if [ -n "$SDK_PATH" ]; then
              echo "sdk.dir=$SDK_PATH" > android/local.properties
            else
              echo "ERROR: Could not find Android SDK"
              exit 1
            fi
          fi
          cat android/local.properties

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (no keystore needed)
        run: cd android && ./gradlew assembleDebug --no-daemon --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30