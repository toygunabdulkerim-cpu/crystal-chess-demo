name: Build Android APK (Gradle)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: '34.0.0'

      - name: Find Android SDK and create local.properties
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la /usr/lib/android-sdk 2>/dev/null || echo "not at /usr/lib/android-sdk"
          ls -la /opt/android 2>/dev/null || echo "not at /opt/android"
          ls -la /usr/local/android-sdk 2>/dev/null || echo "not at /usr/local/android-sdk"
          find / -name "platforms" -path "*/android*" -type d 2>/dev/null | head -5
          # Use the first found Android SDK path
          SDK_PATH=$(find / -name "platforms" -path "*/android*" -type d 2>/dev/null | head -1 | sed 's|/platforms/.*||')
          echo "Found SDK at: $SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > android/local.properties
          cat android/local.properties

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (no keystore needed)
        run: cd android && ./gradlew assembleDebug --no-daemon --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30