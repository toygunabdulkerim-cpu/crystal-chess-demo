name: Build Android APK (Gradle)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: '34.0.0'
        id: android-setup

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Patch Gradle files for Kotlin 2.1.20 compatibility
        run: |
          # Fix gradle wrapper version
          sed -i 's|gradle-9.3.1-bin.zip|gradle-8.9-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          
          # Fix build.gradle - add kotlinVersion def inside buildscript
          sed -i '/^buildscript {/a\  def kotlinVersion = project.hasProperty('\''android.kotlinVersion'\'') ? project.property('\''android.kotlinVersion'\'') : '\''2.1.20'\''\n' android/build.gradle
          sed -i 's|classpath('\''org.jetbrains.kotlin:kotlin-gradle-plugin'\'')|classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlinVersion")|g' android/build.gradle
          
          # Fix app/build.gradle - remove kotlin.android plugin and enableBundleCompression
          sed -i 's|apply plugin: "org.jetbrains.kotlin.android"|// apply plugin: "org.jetbrains.kotlin.android"|g' android/app/build.gradle
          sed -i 's|enableBundleCompression = |// enableBundleCompression = |g' android/app/build.gradle
          
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo "=== app/build.gradle head ==="
          head -20 android/app/build.gradle
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Create local.properties
        run: echo "sdk.dir=${{ steps.android-setup.outputs.sdk-path }}" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30